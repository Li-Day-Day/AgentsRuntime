apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codex-golden-v2
  namespace: clawmanager-ltt-user-1
  labels:
    app: clawmanager-codex-golden
    clawmanager.io/runtime: codex-windows
    clawmanager.io/golden-version: v2
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 80Gi
  storageClassName: longhorn
  volumeMode: Filesystem
---
apiVersion: v1
kind: Pod
metadata:
  name: codex-golden-v2-builder
  namespace: clawmanager-ltt-user-1
  labels:
    app: clawmanager-codex-golden-builder
    clawmanager.io/runtime: codex-windows
    clawmanager.io/golden-version: v2
spec:
  restartPolicy: Never
  nodeSelector:
    clawmanager.io/windows-runtime: "true"
  terminationGracePeriodSeconds: 120
  containers:
    - name: desktop
      image: 10.130.14.23:5000/windows-vm-codex:2026.8.10-phase2-r2
      imagePullPolicy: Always
      securityContext:
        privileged: true
      env:
        - name: VERSION
          value: "11"
        - name: LANGUAGE
          value: Chinese
        - name: REGION
          value: zh-CN
        - name: KEYBOARD
          value: zh-CN
        - name: CPU_CORES
          value: "6"
        - name: RAM_SIZE
          value: 10G
        - name: DISK_SIZE
          value: 80G
        - name: DISK_FMT
          value: qcow2
        - name: SHUTDOWN
          value: "Y"
        - name: QEMU_TIMEOUT
          value: "120"
        - name: HTTP_PROXY
          value: http://clawmanager-egress-proxy.clawmanager-ltt-system.svc.cluster.local:3128
        - name: HTTPS_PROXY
          value: http://clawmanager-egress-proxy.clawmanager-ltt-system.svc.cluster.local:3128
        - name: http_proxy
          value: http://clawmanager-egress-proxy.clawmanager-ltt-system.svc.cluster.local:3128
        - name: https_proxy
          value: http://clawmanager-egress-proxy.clawmanager-ltt-system.svc.cluster.local:3128
        - name: NO_PROXY
          value: localhost,127.0.0.1,.svc,.svc.cluster.local,10.130.14.23
        - name: no_proxy
          value: localhost,127.0.0.1,.svc,.svc.cluster.local,10.130.14.23
      ports:
        - name: http
          containerPort: 8006
          protocol: TCP
        - name: rdp
          containerPort: 3389
          protocol: TCP
      resources:
        requests:
          cpu: "6"
          memory: 12Gi
        limits:
          cpu: "6"
          memory: 12Gi
      volumeMounts:
        - name: data
          mountPath: /storage
        - name: shared
          mountPath: /shared
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: codex-golden-v2
    - name: shared
      emptyDir: {}
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: codex-golden-v2-builder
  namespace: clawmanager-ltt-user-1
  labels:
    app: clawmanager-codex-golden-builder
spec:
  selector:
    app: clawmanager-codex-golden-builder
  ports:
    - name: web
      port: 8006
      targetPort: http
    - name: rdp
      port: 3389
      targetPort: rdp
